services:
  - type: web
    name: entries-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Set in the Render dashboard, not here: an external Postgres connection
      # string (Neon). Render's own free databases expire after 30 days.
      - key: DATABASE_URL
        sync: false
